[project]
name = "codeorbit"
version = "0.1.0"
description = "Local-first code intelligence: a structural code graph answered by a local LLM"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "typer>=0.15",
    "rich>=13.0",
    "requests>=2.31",
    # Required by `codeorbit mcp` and `codeorbit agent`. Omitting it did not
    # break the dev checkout, where it had been pip-installed by hand - it broke
    # every real install, where the server died on import and the agent could
    # only report "not connected".
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codeorbit = "codeorbit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codeorbit", "codeorbit.extract"]

[tool.setuptools.package-data]
codeorbit = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
