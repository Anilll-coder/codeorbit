[project]
name = "codegraph"
version = "0.1.0"
description = "Local-first code intelligence: a structural code graph answered by a local LLM"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "typer>=0.15",
    "rich>=13.0",
    "requests>=2.31",
]

[project.scripts]
codegraph = "codegraph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codegraph", "codegraph.extract"]

[tool.setuptools.package-data]
codegraph = ["schema.sql"]
