[project]
name = "codeorbit"
version = "0.1.0"
description = "Local-First Code Intelligence with Graph-Grounded LLMs"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.25",
    # The three CodeOrbit parses with its own extractors. Direct dependencies
    # rather than going through the pack for everything, so the core languages
    # keep working if the pack ever fails to build on a platform.
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    # ~370 more grammars, as prebuilt wheels for every platform the installer
    # supports. Without it the tool reads three languages, which is the wrong
    # answer for most repositories. `codeorbit/langs.py` degrades to the three
    # built-ins if the import fails, so this staying optional-in-practice is
    # deliberate - but it should be installed.
    "tree-sitter-language-pack>=0.9",
    "typer>=0.15",
    "rich>=13.0",
    "requests>=2.31",
    # Required by `codeorbit mcp` and `codeorbit agent`. Omitting it did not
    # break the dev checkout, where it had been pip-installed by hand - it broke
    # every real install, where the server died on import and the agent could
    # only report "not connected".
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codeorbit = "codeorbit.entry:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codeorbit", "codeorbit.extract"]

[tool.setuptools.package-data]
codeorbit = ["schema.sql", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
