<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="CodeOrbit">
  <title>CodeOrbit</title>
  <!-- Transparent ground on purpose: GitHub renders this against both the
       light and the dark README, and a baked-in panel colour would sit in a
       visible box on one of them. Amber reads on either. -->
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2b658"/>
      <stop offset="100%" stop-color="#d08f2c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2a13f" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#e2a13f" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#e2a13f" stop-opacity=".95"/>
    </linearGradient>
  </defs>

  <!-- Three orbits at different inclinations: the graph is the subject, and a
       single ring reads as a planet rather than a system. -->
  <g fill="none" stroke="url(#ring)" stroke-width="3.5">
    <ellipse cx="60" cy="60" rx="46" ry="20" transform="rotate(-22 60 60)"/>
    <ellipse cx="60" cy="60" rx="46" ry="20" transform="rotate(38 60 60)"/>
    <ellipse cx="60" cy="60" rx="46" ry="20" transform="rotate(92 60 60)" stroke-opacity=".5"/>
  </g>

  <!-- Satellites, placed on the rings rather than near them. -->
  <circle cx="102" cy="43" r="5" fill="#e2a13f"/>
  <circle cx="26" cy="83" r="4" fill="#e2a13f" fill-opacity=".7"/>
  <circle cx="44" cy="20" r="3.4" fill="#e2a13f" fill-opacity=".55"/>

  <circle cx="60" cy="60" r="13" fill="url(#core)"/>
</svg>
